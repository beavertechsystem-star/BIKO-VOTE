<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- GitHub Pages 正式投票介面｜v2.6；GAS Web App 為獨立後端 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf5ff">
  <title>BIKO 中文名字票選｜建功國小</title>
  <style>
    :root { color-scheme:light; --blue:#063fba; --ink:#07349d; }
    * { box-sizing:border-box; }
    html,body { margin:0;min-height:100%;font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    body {background:linear-gradient(150deg,#e8f6ff,#fff 43%,#e7f7e9 100%);color:var(--ink);overflow-x:hidden;}
    button { font:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    .page {min-height:100svh;display:flex;justify-content:center;align-items:center;padding:0;}
    .desktop-stage {width:min(100vw,calc(100svh * 1672 / 941));position:relative;aspect-ratio:1672/941;max-width:1672px;isolation:isolate;box-shadow:0 2px 30px #3a73a313;}
    .desktop-stage .visual {width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;}
    .hotspot {border:none;background:transparent;position:absolute;cursor:pointer;border-radius:10%;z-index:3;transition:box-shadow .2s,transform .2s;}
    .hotspot:hover:not(:disabled) {box-shadow:0 0 0 3px #fff,0 0 0 8px #ffde38;transform:scale(1.015);}
    .hotspot:focus-visible {outline:4px solid #fff;box-shadow:0 0 0 9px #0643c0;outline-offset:0;}
    .hotspot:disabled {cursor:default;}
    .hotspot.chosen {box-shadow:0 0 0 3px #fff,0 0 0 9px #ffe55c;}
    .hotspot.dim {filter:brightness(.65);background:#fff3;}
    .p0 {left:36.3%;top:35.1%;width:22.7%;height:15.6%;}
    .p1 {left:59.7%;top:35.1%;width:22.9%;height:15.6%;}
    .p2 {left:36.3%;top:52.6%;width:22.7%;height:14.9%;}
    .p3 {left:59.7%;top:52.6%;width:22.9%;height:14.9%;}
    .p4 {left:36.3%;top:68.5%;width:22.7%;height:14.9%;}
    .p5 {left:59.7%;top:68.5%;width:22.9%;height:14.9%;}
    .ballot-destination {position:absolute;left:87%;top:73%;width:7%;height:9%;pointer-events:none;}
    .mobile-stage {display:none;}
    .floating-vote {position:fixed;z-index:70;display:flex;align-items:center;justify-content:center;white-space:nowrap;
      color:white;font-weight:950;font-size:clamp(25px,4.8vw,64px);text-shadow:0 3px 4px #18357750;
      border-radius:25px;border:3px solid #fff8;box-shadow:0 13px 30px #15418d4c;pointer-events:none;will-change:transform,opacity;}
    .floating-vote.i0 {background:linear-gradient(135deg,#095be4,#0033a4);}
    .floating-vote.i1 {background:linear-gradient(135deg,#ff9e20,#fb4b0a);}
    .floating-vote.i2 {background:linear-gradient(135deg,#ffe450,#ffae00);}
    .floating-vote.i3 {background:linear-gradient(135deg,#9ccf24,#228320);}
    .floating-vote.i4 {background:linear-gradient(135deg,#ff9d21,#ff4c0b);}
    .floating-vote.i5 {background:linear-gradient(135deg,#24affc,#0269d7);}
    .floating-vote.long {font-size:clamp(21px,3.7vw,51px);}
    /* v2.4: 送票中 / 投票完成提示，固定在可視畫面的正中央（桌面和手機一致） */
    .toast {
      position:fixed;z-index:80;left:50%;top:50%;bottom:auto;
      transform:translate(-50%,-50%);
      width:min(480px,calc(100vw - 32px));
      padding:26px 24px;border:4px solid #fff;
      border-radius:28px;text-align:center;
      background:linear-gradient(135deg,#126ae4,#06369d);color:#fff;
      font-size:clamp(19px,2.5vw,27px);line-height:1.55;font-weight:950;
      white-space:pre-line;overflow-wrap:anywhere;
      box-shadow:0 18px 60px #001f5688,0 0 0 200vmax #061d5854;
      animation:vote-notice-pop .26s cubic-bezier(.2,.8,.2,1.1);
      pointer-events:none;
    }
    @keyframes vote-notice-pop{
      from{opacity:0;transform:translate(-50%,-50%) scale(.85)}
      to{opacity:1;transform:translate(-50%,-50%) scale(1)}
    }
    .toast[hidden],.dialog[hidden],.preview-note[hidden] {display:none;}
    .toast.success {background:linear-gradient(130deg,#17ad5b,#057348);box-shadow:0 18px 60px #003d3088,0 0 0 200vmax #061d5854;}
    .preview-note {position:fixed;z-index:40;left:50%;transform:translateX(-50%);top:8px;background:#fff5d2;border:1px solid #ffd56a;color:#765005;font-size:13px;font-weight:850;padding:8px 18px;border-radius:30px;box-shadow:0 2px 12px #33537c24;text-align:center;}
    .dialog {position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:#0825638c;padding:20px;backdrop-filter:blur(5px);}
    .dialog-card {width:min(440px,100%);background:#fff;border:7px solid #e0efff;padding:28px 18px 25px;border-radius:38px;box-shadow:0 20px 70px #071b637c;text-align:center;animation:popup .32s cubic-bezier(.2,.75,.15,1.1);}
    @keyframes popup {from{opacity:0;transform:scale(.88) translateY(12px)}to{opacity:1;transform:none}}
    .dialog-emoji {font-size:72px;line-height:1.2;}
    .dialog h2 {font-size:clamp(26px,6vw,36px);font-weight:950;color:#0048af;margin:8px 0;}
    .dialog p {font-size:17px;line-height:1.7;font-weight:700;color:#557098;margin:0 0 20px;}
    .dialog button {border:0;border-radius:18px;padding:14px 29px;background:linear-gradient(135deg,#0477f6,#0639b3);font-size:20px;color:#fff;font-weight:950;cursor:pointer;box-shadow:0 8px 0 #b2cff5;}
    .dialog button:disabled {opacity:.5;cursor:wait;}
    .dialog button:focus-visible {outline:4px solid #ffc400;outline-offset:4px;}
    @media(max-width:800px), (orientation:portrait) {
      .page {align-items:flex-start;padding:0 0 22px;}
      .desktop-stage {display:none;}
      .mobile-stage {display:block;width:100%;max-width:650px;margin:0 auto;min-height:100svh;position:relative;padding-bottom:12px;background:radial-gradient(circle at 0 15%,#c3e7ff,transparent 49%),linear-gradient(#fafdff 70%,#e7f5e8);}
      .mobile-top {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 15px 8px;background:#fff;box-shadow:0 2px 14px #0a52a011;}
      .mobile-brand {font-weight:950;color:#0648b8;font-size:13px;letter-spacing:.02em;}
      .mobile-brand span {color:#f46f0a;}
      .school {font-size:11px;font-weight:850;color:#388245;}
      .mhero {display:flex;justify-content:center;align-items:center;gap:0;padding:5px 10px 1px;min-height:184px;}
      .mascot {width:min(41vw,195px);height:auto;max-height:225px;object-fit:contain;mix-blend-mode:multiply;}
      .headline {min-width:0;flex:1;}
      .headline h1 {font-weight:1000;font-size:clamp(25px,7vw,39px);line-height:1.12;margin:0;letter-spacing:.02em;color:#073eb3;text-shadow:0 3px #ffffff;}
      .headline h1 strong{color:#f55b0b;display:block;margin-top:5px;}
      .star{color:#ffbc08;font-size:24px;display:inline;}
      .guide {margin:2px 14px 13px;background:linear-gradient(120deg,#0964d9,#0735aa);border-radius:40px;padding:10px 9px;color:#fff;text-align:center;font-size:clamp(13px,3.5vw,18px);font-weight:950;box-shadow:0 5px 12px #0a56bf35;}
      .mobile-options{padding:0 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
      .mobile-choice{min-width:0;min-height:105px;border:3px solid #fff8;border-radius:23px;position:relative;cursor:pointer;overflow:hidden;color:#fff;text-shadow:0 3px 4px #21335f4d;font-size:clamp(28px,8vw,44px);font-weight:1000;letter-spacing:.03em;box-shadow:0 8px 0 #15418d22,0 9px 20px #0c409524;transition:transform .18s,filter .2s;}
      .mobile-choice::after {content:'';position:absolute;width:120%;height:85%;top:-58%;left:-25%;transform:rotate(-14deg);background:#fff2;border-radius:50%;pointer-events:none;}
      .mobile-choice:hover:not(:disabled){transform:translateY(-3px)}
      .mobile-choice:active:not(:disabled){transform:scale(.96)}
      .mobile-choice:focus-visible {outline:4px solid #ffda21;outline-offset:3px;}
      .mobile-choice:disabled{cursor:default;}
      .mobile-choice.chosen{outline:5px solid #ffdb22;outline-offset:1px;}
      .mobile-choice.dim{filter:grayscale(.5);opacity:.55;}
      .mobile-choice.i0 {background:linear-gradient(145deg,#1a83ed,#0042bc);}
      .mobile-choice.i1 {background:linear-gradient(145deg,#ff9b1e,#ff4b0c);}
      .mobile-choice.i2 {background:linear-gradient(145deg,#ffdd35,#ffb514);}
      .mobile-choice.i3 {background:linear-gradient(145deg,#9ccc31,#358f1c);}
      .mobile-choice.i4 {background:linear-gradient(145deg,#ff9e26,#ff570b);}
      .mobile-choice.i5 {background:linear-gradient(145deg,#32b4fc,#0966d8);font-size:clamp(25px,6.8vw,40px);}
      .mfooter {display:flex;justify-content:center;align-items:center;gap:15px;margin:20px auto 6px;}
      .ballot-mobile {width:68px;height:65px;flex-shrink:0;filter:drop-shadow(0 6px 4px #26478031);}
      .mfooter .note {font-size:15px;font-weight:950;color:#0941b3;line-height:1.35;}
      .mfooter small {display:block;font-size:11px;font-weight:750;color:#57789f;margin-top:4px;}
      .disclaimer {text-align:center;color:#6a88a5;font-size:12px;font-weight:800;margin:8px 0 0;}
      .floating-vote{font-size:clamp(24px,7vw,43px);border-radius:20px;}
      .floating-vote.long {font-size:clamp(22px,6vw,37px);}
      .toast{top:50%;bottom:auto;font-size:clamp(20px,5.3vw,25px);padding:25px 18px;border-radius:24px;}
    }
    @media(max-width:359px){.mobile-options{gap:9px;padding:0 10px}.mobile-choice{min-height:92px;border-radius:18px}.mhero{min-height:150px}.mascot{width:36vw}.guide{margin:0 10px 10px}.mfooter{margin-top:14px}}

    /* v2.3: 動態引導：真正的文字元件，可跳動與亮光，不再是背景圖片上的死文字 */
    .desktop-stage{container-type:inline-size;}
    .desktop-guide{
      position:absolute;z-index:5;left:39.02%;top:24.40%;width:38.77%;height:6.68%;
      display:flex;align-items:center;justify-content:center;
      padding:0 1%;border-radius:999px;white-space:nowrap;
      background:linear-gradient(116deg,#1678e8 0%,#0854ce 42%,#043aa9 100%);
      color:#fff;font-size:1.97cqw;letter-spacing:.025em;font-weight:950;
      text-shadow:0 2px 1px #08337966;
      box-shadow:inset 0 2px 0 #ffffff6c,0 4px 8px #266acd35;
      animation:guide-hop 2.35s ease-in-out infinite;
      transform-origin:center center;
      pointer-events:none;
    }
    .desktop-guide::before{content:'';position:absolute;inset:2px;border-radius:999px;
      background:linear-gradient(130deg,#ffffff28 1%,transparent 42%);pointer-events:none;}
    .desktop-guide::after{content:'✦';position:absolute;right:2%;top:-17%;
      color:#ffdc3c;font-size:1.95cqw;text-shadow:0 1px 7px #fff,0 0 12px #f8bc14;
      animation:guide-spark 1.5s ease-in-out infinite;}
    @keyframes guide-hop{
      0%,9%,46%,100%{transform:translateY(0) scale(1);filter:brightness(1)}
      15%{transform:translateY(-.55cqw) scale(1.035);filter:brightness(1.19)}
      21%{transform:translateY(.17cqw) scale(.99);filter:brightness(1.1)}
      27%{transform:translateY(-.21cqw) scale(1.01)}
      34%{transform:translateY(0) scale(1)}
    }
    @keyframes guide-spark{0%,50%,100%{opacity:.35;transform:scale(.8) rotate(-18deg)}25%,75%{opacity:1;transform:scale(1.25) rotate(22deg)}}
    .open-results-desktop{
      z-index:8;position:absolute;left:84.5%;top:87.5%;width:12.65%;height:6.3%;
      display:flex;justify-content:center;align-items:center;gap:5px;
      background:linear-gradient(145deg,#fff9d7,#ffe18a);border:2px solid #f7b522;
      border-radius:999px;color:#0944a6;font-weight:1000;font-size:1.73cqw;
      box-shadow:0 5px 0 #d59a2869,0 8px 16px #1b65b82b;cursor:pointer;
      transition:transform .16s,box-shadow .16s;
    }
    .open-results-desktop:hover{transform:translateY(-3px);box-shadow:0 8px 0 #d59a2869,0 12px 19px #1b65b833;}
    .open-results-desktop:active{transform:translateY(1px);box-shadow:0 2px 0 #d59a2869;}
    .open-results-desktop:focus-visible,.open-results-mobile:focus-visible{outline:4px solid #065bc8;outline-offset:3px;}
    .guide{animation:mobile-guide-hop 2.35s ease-in-out infinite;transform-origin:center;}
    .guide::before{content:'✨ ';}
    @keyframes mobile-guide-hop{
      0%,9%,46%,100%{transform:translateY(0) scale(1);filter:brightness(1)}
      15%{transform:translateY(-4px) scale(1.025);filter:brightness(1.25)}
      22%{transform:translateY(1px) scale(.99)}
      28%{transform:translateY(-2px) scale(1.008)}
      34%{transform:translateY(0) scale(1)}
    }
    .open-results-mobile{
      min-width:145px;background:linear-gradient(145deg,#fff6ca,#ffdd79);color:#0742a2;
      border:2px solid #f1b836;border-radius:18px;padding:12px 17px;
      font-size:19px;font-weight:1000;letter-spacing:.04em;
      box-shadow:0 5px 0 #e6af3963,0 8px 15px #1454aa22;cursor:pointer;
    }
    .open-results-mobile:active{transform:translateY(2px);}
    .admin-overlay[hidden],.admin-step[hidden],.results-step[hidden]{display:none!important;}
    .admin-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;
      background:#041c57a8;backdrop-filter:blur(6px);padding:16px;overflow:auto;}
    .admin-card{position:relative;width:min(520px,100%);max-height:94svh;overflow:auto;
      background:linear-gradient(180deg,#f3faff,#fff 36%);border:5px solid #e0f1ff;
      border-radius:30px;padding:27px 25px 23px;text-align:center;color:#073d9d;
      box-shadow:0 24px 70px #00194d83;animation:popup .28s ease-out;}
    .admin-close{position:absolute;right:12px;top:12px;border:0;border-radius:50%;
      width:35px;height:35px;background:#e9f2fc;color:#31537c;font-size:22px;cursor:pointer;}
    .admin-icon{font-size:52px;line-height:1.1;margin:0 0 3px;}
    .admin-card h2{font-size:clamp(24px,5.5vw,31px);margin:7px 0;font-weight:950;}
    .admin-card p{margin:0 0 15px;color:#5d738b;line-height:1.6;font-size:15px;}
    .admin-form{text-align:left;display:grid;gap:10px;margin-top:15px;}
    .admin-form label{font-weight:900;color:#174d9d;font-size:15px;}
    .admin-form input{width:100%;border:2px solid #bfd4ed;border-radius:14px;
      padding:12px 14px;font:inherit;font-size:22px;letter-spacing:.12em;color:#123f8a;
      text-align:center;outline:none;background:#fff;}
    .admin-form input:focus{border-color:#046be8;box-shadow:0 0 0 4px #0a69ec22;}
    .admin-primary{width:100%;border:0;background:linear-gradient(120deg,#157fea,#0641ba);color:white;
      padding:12px 20px;border-radius:15px;font-size:18px;font-weight:950;cursor:pointer;
      box-shadow:0 4px 0 #063e8c77;}
    .admin-primary:disabled{opacity:.55;cursor:wait;}
    .admin-error{min-height:1.5em;color:#c73e2e;font-size:14px;font-weight:850;text-align:center;}
    .results-stats{display:flex;flex-direction:column;gap:1px;align-items:center;
      border-radius:18px;padding:13px 14px;background:#eaf4ff;margin:12px 0 16px;}
    .results-stats strong{font-size:40px;color:#0644a9;line-height:1.15;}
    .results-stats span{font-size:13px;font-weight:800;color:#5b799c;}
    .results-list{display:flex;flex-direction:column;gap:10px;text-align:left;}
    .result-row{background:#f6faff;border:1px solid #dfebfc;border-radius:13px;padding:9px 12px;}
    .result-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-weight:950;font-size:18px;}
    .result-line strong{font-size:20px;color:#0640a5;white-space:nowrap;}
    .result-track{background:#d9e7f5;height:9px;border-radius:999px;overflow:hidden;margin-top:7px;}
    .result-bar{height:100%;width:0;min-width:0;border-radius:999px;transition:width .45s ease;}
    .last-vote{margin-top:5px;color:#69839f;font-size:11px;font-weight:700;}
    .results-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
    .results-actions button{border:2px solid #c7dfff;border-radius:13px;padding:11px 8px;
      cursor:pointer;background:#fff;color:#0c4aa7;font-weight:900;font-size:15px;}
    .results-actions button:first-child{background:#e5f1ff;}
    .results-actions button:disabled{opacity:.55;cursor:wait;}
    @media(max-width:800px), (orientation:portrait){
      .admin-card{padding:25px 17px 20px;border-radius:25px;}
      .open-results-mobile{font-size:18px;}
    }
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>

  <div class="preview-note" id="previewNote" hidden>尚未連接後端，請管理者先設定 Apps Script 網址</div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>正在送出你的選票…</div>
  <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden>
    <div class="dialog-card">
      <div class="dialog-emoji" id="dialogEmoji">🎉</div>
      <h2 id="dialogTitle">尚未確認投票</h2>
      <p id="dialogText">網路可能不穩，請重新傳送同一張選票。</p>
      <button id="dialogNext" type="button">重新送出本票</button>
    </div>
  </section>

  <!-- 開票結果僅由後端通過密碼驗證後才傳送，前端不含密碼與任何票數 -->
  <section class="admin-overlay" id="adminOverlay" role="dialog" aria-modal="true" aria-labelledby="adminTitle" hidden>
    <div class="admin-card">
      <button class="admin-close" id="adminClose" type="button" aria-label="關閉開票視窗">×</button>
      <div class="admin-step" id="adminPasswordStep">
        <div class="admin-icon">🗳️</div>
        <h2 id="adminTitle">開啟 BIKO 投票箱</h2>
        <p>管理人員請輸入密碼，查看即時開票結果。</p>
        <form class="admin-form" id="adminForm">
          <label for="adminPassword">開票密碼</label>
          <input id="adminPassword" name="password" type="password" inputmode="numeric" autocomplete="off" placeholder="輸入開票密碼" maxlength="20" required>
          <button class="admin-primary" type="submit" id="adminSubmit">🔓 確認開票</button>
          <div class="admin-error" id="adminError" role="alert" aria-live="polite"></div>
        </form>
      </div>
      <div class="results-step" id="adminResultsStep" hidden>
        <div class="admin-icon">🏆</div>
        <h2>BIKO 中文名字開票結果</h2>
        <div class="results-stats"><span>目前總票數</span><strong id="adminTotal">0</strong><span id="adminUpdated">資料更新中…</span></div>
        <div class="results-list" id="adminResultsList" aria-live="polite"></div>
        <div class="results-actions">
          <button id="adminRefresh" type="button">↻ 更新票數</button>
          <button id="adminDone" type="button">完成開票</button>
        </div>
        <div class="admin-error" id="adminRefreshError" role="alert" aria-live="polite"></div>
      </div>
    </div>
  </section>
<script>
(function(){
  'use strict';
  const choices=Array.from(document.querySelectorAll('[data-vote]'));
  // ★ 只需把這一行改成你自己 Google Apps Script 網頁應用程式的 /exec 網址。
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzn-KBqWcgDKRFq9OY_svoaCcPJEA6ESWwiEa3VjAJd_DmnIWp6cd_5kU_Hf4Xov5fr/exec';
  const apiReady = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(GAS_WEB_APP_URL.trim());
  const preview = !apiReady;
  const dialog=document.getElementById('dialog');
  const dlgTitle=document.getElementById('dialogTitle');
  const dlgEmoji=document.getElementById('dialogEmoji');
  const dlgText=document.getElementById('dialogText');
  const dlgNext=document.getElementById('dialogNext');
  const toast=document.getElementById('toast');
  const voteNames=['比寶','活栗寶','皮可','小可','迪可','建功小狸'];
  let busy=false,pending=null;
  if(preview){ const note=document.getElementById('previewNote'); note.textContent='尚未設定 GAS 後端網址：目前不會記票'; note.hidden=false; }
  const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const makeId=()=> 'biko_'+(window.crypto&&crypto.randomUUID?crypto.randomUUID().replaceAll('-','_'):Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,16));
  const isMobile=()=>getComputedStyle(document.querySelector('.mobile-stage')).display!=='none';
  // Google Apps Script 不提供一般 GitHub fetch 可讀取的 CORS 回應。
  // 用 no-cors POST 寫入，再以 JSONP GET 查詢隨機請求的狀態；絕不猜測成功。
  function checkStatus(kind, requestId){
    return new Promise((resolve,reject)=>{
      const cb='bikoCallback_'+Math.random().toString(36).slice(2,13);
      const script=document.createElement('script');
      let finished=false;
      const timeout=setTimeout(()=>finish(new Error('確認回應逾時')),8000);
      function finish(err,data){
        if(finished)return;
        finished=true;
        clearTimeout(timeout);
        script.remove();
        try{delete window[cb];}catch(_){window[cb]=undefined;}
        err?reject(err):resolve(data);
      }
      window[cb]=data=>finish(null,data);
      script.onerror=()=>finish(new Error('無法連線到投票資料庫'));
      const url = GAS_WEB_APP_URL + '?api=status&kind=' + encodeURIComponent(kind)
        +'&requestId='+encodeURIComponent(requestId)+'&callback='+encodeURIComponent(cb)
        +'&_='+Date.now();
      script.src=url;
      document.head.appendChild(script);
    });
  }
  async function callBackend(action, payload, requestId){
    if(!apiReady)throw new Error('尚未設定 GAS 後端網址，請先完成連線設定。');
    // text/plain 屬於簡單請求，不觸發 OPTIONS 預檢；no-cors 不能讀取回應。
    // 即使 fetch 因網路中斷失敗，仍嘗試用 requestId 確認後端有無完成。
    try{
      await fetch(GAS_WEB_APP_URL, {
        method:'POST',mode:'no-cors',redirect:'follow',cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=UTF-8'},
        body:JSON.stringify({action,requestId,...payload})
      });
    }catch(err){console.warn('傳送連線未確認，將查詢記錄狀態',err);}
    const start=Date.now();
    let lastError=null;
    while(Date.now()-start<12000){
      try{
        const result=await checkStatus(action==='results'?'results':'vote',requestId);
        if(result && result.state==='ok')return action==='results'?result.data:{ok:true};
        if(result && result.state==='error')throw new Error(result.message||'後端記錄失敗');
      }catch(err){
        if(err && /密碼錯誤|記錄失敗|無法讀取結果/.test(err.message||''))throw err;
        lastError=err;
      }
      await pause(650);
    }
    throw lastError || new Error('尚未取得寫入確認，請重送同一張選票。');
  }
  function sendVote(name,id){
    return callBackend('vote',{name},id);
  }
  async function fly(name,i,btn){
    const from=btn.getBoundingClientRect();
    const target=document.getElementById(isMobile()?'mobileBallot':'desktopBallot').getBoundingClientRect();
    const ghost=document.createElement('div');
    ghost.className='floating-vote i'+i+(name.length>3?' long':'');
    ghost.textContent=name;
    ghost.style.cssText+='left:'+from.left+'px;top:'+from.top+'px;width:'+from.width+'px;height:'+from.height+'px;';
    document.body.appendChild(ghost);
    const dx=target.left+target.width/2-(from.left+from.width/2);
    const dy=target.top+target.height/2-(from.top+from.height/2);
    const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!ghost.animate||reduced){ghost.remove();return;}
    await new Promise(resolve=>{
      const anim=ghost.animate([
        {transform:'translate(0,0) scale(.92)',opacity:.95,offset:0},
        {transform:'translate(0,-7px) scale(1.17)',opacity:1,offset:.28},
        {transform:'translate('+dx*.22+'px,'+dy*.12+'px) scale(1.02)',opacity:1,offset:.48},
        {transform:'translate('+dx+'px,'+dy+'px) scale(.08) rotate(-18deg)',opacity:0,offset:1}
      ],{duration:560,easing:'cubic-bezier(.19,.65,.33,1)',fill:'forwards'});
      anim.onfinish=()=>{ghost.remove();resolve();};
      anim.oncancel=()=>{ghost.remove();resolve();};
    });
  }
  function resetForNextVoter(){
    // 0.62秒成功提示後恢復投票；每一次新點擊都產生獨立的選票編號。
    dialog.hidden=true;
    toast.hidden=true;
    toast.classList.remove('success');
    busy=false;
    pending=null;
    choices.forEach(b=>{b.disabled=false;b.classList.remove('dim','chosen');});
    // 不強迫焦點移到第一個名字，避免下一位操作時畫面突然跳動。
    if(document.activeElement && document.activeElement.blur)document.activeElement.blur();
  }
  async function onVoteSuccess(){
    pending=null;
    dialog.hidden=true;
    toast.textContent='🎉 投票成功！\n下一位可以投票囉！';
    toast.classList.add('success');
    toast.hidden=false;
    // v2.5 快速投票：成功回饋縮為 0.62 秒，接著恢復下一票；不得早於後端確認。
    await pause(620);
    resetForNextVoter();
  }
  function showRetryDialog(){
    toast.hidden=true;
    toast.classList.remove('success');
    dialog.hidden=false;
    dlgEmoji.textContent='📶';
    dlgTitle.textContent='尚未確認投票';
    dlgText.textContent='可能是網路不穩，或尚未設定後端。請重新送出同一張選票；後端會用選票碼避免重複計票。';
    dlgNext.textContent='重新送出本票';
    dlgNext.disabled=false;
    dlgNext.focus();
  }
  async function choose(btn){
    if(busy)return; // 只在傳送和動畫期間防連點；不是防止下一位投票。
    const name=btn.dataset.vote;
    const idx=Number(btn.dataset.i);
    if(voteNames[idx]!==name)return;
    busy=true;
    choices.forEach(c=>{c.disabled=true;c.classList.toggle('dim',c!==btn);});
    btn.classList.add('chosen');
    toast.classList.remove('success');
    toast.textContent='正在送出選票…';
    toast.hidden=false;
    const id=makeId();
    pending={name,id};
    try{
      // v2.5：0.56 秒飛入動畫與後端記票同步進行；後端成功才顯示成功。
      await Promise.all([fly(name,idx,btn),sendVote(name,id)]);
      await onVoteSuccess();
    }catch(e){
      console.error('Vote failed:',e);
      showRetryDialog();
    }
  }

  // v2.3 管理端：只有正確密碼，Apps Script 才會傳回開票資料；不於 HTML 存密碼。
  const adminOverlay=document.getElementById('adminOverlay');
  const adminPasswordStep=document.getElementById('adminPasswordStep');
  const adminResultsStep=document.getElementById('adminResultsStep');
  const adminPass=document.getElementById('adminPassword');
  const adminError=document.getElementById('adminError');
  const adminSubmit=document.getElementById('adminSubmit');
  const adminRefresh=document.getElementById('adminRefresh');
  const adminRefreshError=document.getElementById('adminRefreshError');
  const adminColors=['#0964e1','#ff6a16','#f6b516','#54a021','#ff7113','#1496e8'];
  let adminSessionPassword='';
  function closeAdmin(){
    adminOverlay.hidden=true;
    adminPass.value='';adminSessionPassword='';adminError.textContent='';adminRefreshError.textContent='';
    adminPasswordStep.hidden=false;adminResultsStep.hidden=true;
  }
  function openAdmin(){
    if(busy)return; // 正在投票時不能打斷那張選票的送出
    adminPasswordStep.hidden=false;adminResultsStep.hidden=true;
    adminError.textContent='';adminRefreshError.textContent='';adminPass.value='';
    adminOverlay.hidden=false;
    adminPass.focus();
  }
  function fetchResults(secret){
    return callBackend('results',{password:secret},makeId());
  }
  function populateResults(data){
    if(!data||!Array.isArray(data.results))throw new Error('伺服器回傳的結果格式不正確。');
    document.getElementById('adminTotal').textContent=String(data.total || 0);
    document.getElementById('adminUpdated').textContent='更新時間：'+(data.updatedAt || '剛剛');
    const list=document.getElementById('adminResultsList');
    list.replaceChildren();
    const maximum=Math.max(1,...data.results.map(v=>Number(v.count)||0));
    data.results.forEach((r,i)=>{
      const row=document.createElement('div');row.className='result-row';
      const line=document.createElement('div');line.className='result-line';
      const name=document.createElement('span');name.textContent=r.name;
      const count=document.createElement('strong');count.textContent=String(r.count)+' 票';
      line.append(name,count);
      const track=document.createElement('div');track.className='result-track';
      const bar=document.createElement('div');bar.className='result-bar';
      bar.style.background=adminColors[i%adminColors.length];
      bar.style.width=(100*Math.max(0,Number(r.count)||0)/maximum)+'%';
      track.append(bar);
      const last=document.createElement('div');last.className='last-vote';
      last.textContent='最後一票：'+(r.lastVoteAt || '尚未有選票');
      row.append(line,track,last);list.append(row);
    });
    adminPasswordStep.hidden=true;adminResultsStep.hidden=false;
  }
  document.querySelectorAll('[data-open-results]').forEach(btn=>btn.addEventListener('click',openAdmin));
  document.getElementById('adminClose').addEventListener('click',closeAdmin);
  document.getElementById('adminDone').addEventListener('click',closeAdmin);
  adminOverlay.addEventListener('click',e=>{if(e.target===adminOverlay)closeAdmin();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!adminOverlay.hidden)closeAdmin();});
  document.getElementById('adminForm').addEventListener('submit',async e=>{
    e.preventDefault();if(adminSubmit.disabled)return;
    const secret=adminPass.value.trim();
    if(!secret){adminError.textContent='請輸入開票密碼。';return;}
    adminError.textContent='';adminSubmit.disabled=true;adminSubmit.textContent='正在確認密碼…';
    try{
      const data=await fetchResults(secret);
      if(adminOverlay.hidden)return;
      populateResults(data);
      adminSessionPassword=secret;
      adminPass.value='';
    }catch(err){
      if(adminOverlay.hidden)return;
      adminError.textContent=err && err.message ? err.message : '無法開票，請稍後重試。';
      adminPass.value='';
    }finally{adminSubmit.disabled=false;adminSubmit.textContent='🔓 確認開票';}
  });
  adminRefresh.addEventListener('click',async()=>{
    if(!adminSessionPassword||adminRefresh.disabled)return;
    adminRefresh.disabled=true;adminRefresh.textContent='更新中…';adminRefreshError.textContent='';
    try{populateResults(await fetchResults(adminSessionPassword));}
    catch(err){adminRefreshError.textContent=err && err.message ? err.message : '更新失敗，請重新開票。';}
    finally{adminRefresh.disabled=false;adminRefresh.textContent='↻ 更新票數';}
  });

  choices.forEach(btn=>btn.addEventListener('click',()=>choose(btn)));
  dlgNext.addEventListener('click',async()=>{
    if(!pending)return;
    dlgNext.disabled=true;
    dialog.hidden=true;
    toast.textContent='正在重新送出同一張選票…';
    toast.hidden=false;
    try{
      // 使用相同識別碼重送，不會重複增加票數。
      await sendVote(pending.name,pending.id);
      await onVoteSuccess();
    }catch(e){
      console.error('Vote retry failed:',e);
      showRetryDialog();
    }
  });
})();
</script>
</body>
</html>
